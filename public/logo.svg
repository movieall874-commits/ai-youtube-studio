<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Triangle Gradient: Cyan to Purple -->
    <linearGradient id="playGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Outer Ring Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Filter for subtle neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Dark Disc -->
  <circle cx="100" cy="100" r="95" fill="#0c0e1a" stroke="url(#ringGrad)" stroke-width="7" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#1e2544" stroke-width="1.5" opacity="0.75" />

  <!-- Dashed Arc at top-left: Cyan -->
  <!-- Arc from angle approx 200 deg to 85 deg -->
  <path
    d="M 54,102 A 54 54 0 0 1 102,46"
    fill="none"
    stroke="#00e5ff"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-dasharray="10 13"
  />

  <!-- Main Center Play Triangle -->
  <!-- Vertices: Top-left (78, 62), Bottom-left (78, 138), Right apex (136, 100) -->
  <polygon
    points="78,62 136,100 78,138"
    fill="url(#playGrad)"
  />

  <!-- Glowing Cyan Apex Dot -->
  <circle cx="136" cy="100" r="6" fill="#00e5ff" />

  <!-- Purple Curved Sweep from apex under the triangle -->
  <path
    d="M 142,100 C 145,135 125,150 96,146"
    fill="none"
    stroke="#9333ea"
    stroke-width="7.5"
    stroke-linecap="round"
  />
</svg>
